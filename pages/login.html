<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Healthcare Connect | Login</title>


    <!-- ================= GOOGLE FONT ================= -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- ================= BOOTSTRAP ICONS ================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ================= CSS ================= -->

    <link rel="stylesheet" href="../css/variables.css">

    <link rel="stylesheet" href="../css/reset.css">

    <link rel="stylesheet" href="../css/components.css">

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <main class="login-page">


        <!-- ==================================================
                             HERO
        =================================================== -->

        <section class="login-hero">

            <div class="hero-icon">

                <i class="bi bi-heart-pulse-fill"></i>

            </div>


            <h1>
                Healthcare Connect
            </h1>


            <p>
                Your Health, Our Priority
            </p>

        </section>



        <!-- ==================================================
                           LOGIN CARD
        =================================================== -->

        <section class="login-container">

            <div class="login-card">


                <!-- ================= LOGIN HEADER ================= -->

                <div class="login-header">

                    <h2>
                        Welcome Back 👋
                    </h2>

                    <p>
                        Sign in to continue your healthcare journey.
                    </p>

                </div>



                <!-- ================= LOGIN FORM ================= -->

                <form id="loginForm">


                    <!-- ================= EMAIL ================= -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email">

                            Email Address

                        </label>


                        <div class="input-box">

                            <i class="bi bi-envelope"></i>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required>

                        </div>

                    </div>



                    <!-- ================= PASSWORD ================= -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password">

                            Password

                        </label>


                        <div class="input-box">

                            <i class="bi bi-lock"></i>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required>


                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>



                    <!-- ================= LOGIN OPTIONS ================= -->

                    <div class="login-options">


                        <label class="remember">

                            <input
                                type="checkbox"
                                name="remember">

                            Remember Me

                        </label>


                        <a href="#"
                           id="forgotPassword">

                            Forgot Password?

                        </a>

                    </div>



                    <!-- ================= LOGIN BUTTON ================= -->

                    <button
                        type="submit"
                        class="btn-primary">

                        Login

                    </button>


                </form>



                <!-- ================= DIVIDER ================= -->

                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>



                <!-- ================= GOOGLE LOGIN ================= -->

                <button
                    type="button"
                    class="btn-secondary"
                    id="googleLogin">

                    <i class="bi bi-google"></i>

                    Continue with Google

                </button>



                <!-- ================= REGISTER ================= -->

                <div class="register-link">

                    <p>

                        Don't have an account?

                        <a href="#"
                           id="createAccount">

                            Create Account

                        </a>

                    </p>

                </div>


            </div>

        </section>


    </main>



    <!-- ==================================================
                         LOGIN JAVASCRIPT
    =================================================== -->

    <script src="../js/login.js"></script>


</body>

</html>
